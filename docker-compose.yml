
services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  spark:
    image: spark:${SPARK_TAG}
    container_name: spark-job
    working_dir: /app
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - neo4j
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy
      --packages ${SPARK_PACKAGES}
      /app/main.py

volumes:
  neo4j_data:
